  renderRtWeekdays();
}
function openRoutineModal(id,presetDay,presetPerson){
  routineEditId=id||null;
  var rule=id?(allData._routines||[]).find(function(r){return String(r.id)===String(id);}):null;
  document.getElementById('routine-modal-title').textContent=rule?'반복 업무 수정':'반복 업무 추가';
  document.getElementById('rt-task').value=rule?rule.task:'';
  document.getElementById('rt-person').value=rule?rule.person:(presetPerson||PERSONS[0]);
  document.getElementById('rt-freq').value=rule?routineFreqOf(rule):(presetDay?'monthly':'daily');
  rtWeekdays=rule?parseWeekdays(rule):[1,2,3,4,5];
  document.getElementById('rt-daytype').value=rule?rule.dayType:'day';
  document.getElementById('rt-day').value=rule?(rule.dayOfMonth||1):(presetDay||1);
  document.getElementById('rt-shift').value=rule?rule.weekendShift:'none';
  document.getElementById('rt-note').value=rule?rule.note:'';
  document.getElementById('rt-active').checked=rule?!!rule.active:true;
  document.getElementById('rt-delete-btn').style.display=rule?'':'none';
  document.getElementById('rt-save-btn').textContent='저장';
  document.getElementById('rt-save-btn').disabled=false;
  onRoutineDayTypeChange();
  onRoutineFreqChange();
  if(rule) document.getElementById('routine-modal-sub').textContent=routineWhenLabel(rule)+' · '+rule.person;
  document.getElementById('routine-modal-bg').classList.add('open');
  setTimeout(function(){document.getElementById('rt-task').focus();},100);
}
function closeRoutineModal(){document.getElementById('routine-modal-bg').classList.remove('open');}
document.getElementById('routine-modal-bg').onclick=function(e){if(e.target===this)closeRoutineModal();};

async function saveRoutine(){
  if(routineSaving) return;
  var task=document.getElementById('rt-task').value.trim();
  if(!task){showToast('업무 내용을 입력하세요');return;}
  var freq=document.getElementById('rt-freq').value;
  var payload={
    person:document.getElementById('rt-person').value,
    task:task,
    freq:freq,
    weekdays:(freq==='monthly')?null:rtWeekdays.slice().sort(function(a,b){return a-b;}).join(','),
    day_type:document.getElementById('rt-daytype').value,
    day_of_month:parseInt(document.getElementById('rt-day').value||'1',10),
    weekend_shift:document.getElementById('rt-shift').value,
    note:document.getElementById('rt-note').value.trim(),
    active:document.getElementById('rt-active').checked,
  };
  if(payload.day_type==='last') payload.day_of_month=null;
  var btn=document.getElementById('rt-save-btn');
  routineSaving=true; btn.textContent='저장 중...'; btn.disabled=true;
  try{
    if(routineEditId){
      var res=await _sb.from('biz_routine').update(payload).eq('id',parseInt(routineEditId));
      if(res.error) throw res.error;
      var r=(allData._routines||[]).find(function(x){return String(x.id)===String(routineEditId);});
      if(r){r.person=payload.person;r.task=payload.task;r.dayType=payload.day_type;
        r.freq=payload.freq;r.weekdays=payload.weekdays||'';
        r.dayOfMonth=payload.day_of_month;r.weekendShift=payload.weekend_shift;
        r.note=payload.note;r.active=payload.active;}
    } else {
      payload.created_at=dk(new Date());
      var ins=await _sb.from('biz_routine').insert(payload).select().single();
      if(ins.error) throw ins.error;
      allData._routines=allData._routines||[];
      allData._routines.push({id:String(ins.data.id),person:payload.person,task:payload.task,
        freq:payload.freq,weekdays:payload.weekdays||'',
        dayType:payload.day_type,dayOfMonth:payload.day_of_month,weekendShift:payload.weekend_shift,
        note:payload.note,active:payload.active});
    }
    closeRoutineModal(); renderRoutine(); render(); showToast('저장됐어요!');
  }catch(err){
    showToast('오류: '+(err.message||err));
  }
  routineSaving=false; btn.textContent='저장'; btn.disabled=false;
}

async function deleteRoutine(){
  if(!routineEditId) return;
  if(!confirm('이 반복 업무를 삭제할까요? 지난 완료 기록도 함께 지워져요.')) return;
  var res=await _sb.from('biz_routine').delete().eq('id',parseInt(routineEditId));
  if(res.error){showToast('삭제 실패');return;}
  var prefix='r'+routineEditId+'_';
  await _sb.from('biz_check').delete().eq('type','routine').like('item_key',prefix+'%');
  Object.keys(checks).forEach(function(k){if(k.indexOf(prefix)===0) delete checks[k];});
  allData._routines=(allData._routines||[]).filter(function(r){return String(r.id)!==String(routineEditId);});
  closeRoutineModal(); renderRoutine(); render(); showToast('삭제됐어요!');
}

loadData();
</script>
